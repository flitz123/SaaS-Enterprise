services:
  - type: web
    name: saas-enterprise-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: saas-enterprise-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://saas-enterprise-ui.onrender.com

  - type: web
    name: saas-enterprise-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://saas-enterprise-api.onrender.com

databases:
  - name: saas-enterprise-db
    databaseName: saas_db
    user: saas
    plan: free